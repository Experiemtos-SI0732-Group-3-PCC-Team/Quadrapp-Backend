version: "3.9"

services:
  app:
    build: .
    container_name: quadrapp-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/quadrappdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - db
    restart: always

  db:
    image: mysql:8.0
    container_name: quadrapp-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: quadrappdb
      MYSQL_USER: quadrapp
      MYSQL_PASSWORD: quadrapp
    ports:
      - "3307:3306"
    volumes:
      - quadrapp-data:/var/lib/mysql

volumes:
  quadrapp-data: